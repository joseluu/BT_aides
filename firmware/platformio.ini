; Phase 0 — validation du role client L2CAP CoC (NimBLE) sur XIAO ESP32-S3
; Base : exemple officiel ESP-IDF examples/bluetooth/nimble/ble_l2cap_coc/coc_blecent
; Voir ../docs/plan_implementation.md (Phase 0)

[platformio]
src_dir = main

; XIAO ESP32-S3 (antenne externe IPEX) sur carte Seeed "XIAO Debug Mate" — carte
; de remplacement de la Supermini a partir du 2026-10-11. Memes GPIO que la Supermini :
; BCK = D4 (GPIO5), LRCK = D5 (GPIO6), DATA = D8 (GPIO7), MCLK non connecte ;
; console UART0 TX = D6 (GPIO43). Flash 8MB (le preset du board l'impose, sdkconfig
; genere identique a esp32s3_com12 a part la taille flash).
[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Carte reellement disponible sur la table au 2026-09-12 (verifie via `esptool chip-id` :
; chip Detecte = ESP32-C3, pas S3 malgre le nom "xiao ESP32-S3" suppose au depart).
; Mono-coeur RISC-V — a migrer vers un vrai S3 avant les phases audio temps reel si la
; cadence 20ms s'avere instable (voir architecture.md, risque #3, et plan_implementation.md
; Phase 0). sdkconfig.defaults est PARTAGE entre les deux env — sa ligne de taille flash
; (4MB) correspond a CE C3 ; la remettre a 8MB en repassant sur le vrai S3.
[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = espidf
monitor_speed = 115200
upload_port = COM8
monitor_port = COM8

; Vrai ESP32-S3 generique (devkit nu, pas une XIAO) trouve le 2026-09-13 sur
; COM12 — teste ici pour eliminer l'hypothese que le rejet ~30ms apres le
; premier envoi audio (voir plan_implementation.md Round 3) serait du a un
; probleme de timing/ordonnancement specifique au C3 mono-coeur. Flash 4MB
; confirme via esptool chip-id, coherent avec sdkconfig.defaults partage.
[env:esp32s3_com12]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_port = COM12
monitor_port = COM12
