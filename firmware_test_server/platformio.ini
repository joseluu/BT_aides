; Serveur de test L2CAP CoC (exemple officiel coc_bleprph, non modifie)
; Utilise pour valider le mecanisme d'envoi bas niveau de notre client ASHA,
; independamment de l'aide auditive reelle. Carte temporaire (COM13), a rendre
; a l'utilisateur pour un autre projet ensuite.
; Voir ../docs/plan_implementation.md (Round 3)

[platformio]
src_dir = main

[env:test_server_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_port = COM13
monitor_port = COM13
