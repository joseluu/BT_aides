; Client de test L2CAP CoC (base sur l'exemple officiel coc_blecent, seul le
; contenu de la trame envoyee est modifie pour reproduire exactement la trame
; qui echoue contre l'aide ASHA reelle). Sert a valider notre mecanisme
; d'envoi bas niveau contre un serveur qu'on controle (firmware_test_server/,
; sur COM13), independamment de l'aide.
; Voir ../docs/plan_implementation.md (Round 3)
;
; Carte cible : COM12 (S3 destine a devenir la carte definitive du projet
; ASHA une fois ce diagnostic termine).

[platformio]
src_dir = main

[env:test_client_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_port = COM12
monitor_port = COM12
